name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_VERSION) is lower than 17."
            exit 1
          fi
          echo "Java version check passed ($JAVA_VERSION >= 17)."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore missing, generating new debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "./debug.keystore is verified and ready."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK existence
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK was not found!"
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || echo "No APK files found."
            exit 1
          fi
          echo "Successfully verified $TARGET_APK exists."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
